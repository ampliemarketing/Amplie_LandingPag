server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão para HTML, CSS, JS e SVG
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JS e CSS do build têm hash no nome: podem ficar em cache por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagens e vídeos da pasta public
    location ~* \.(png|jpe?g|webp|gif|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para as atualizações aparecerem na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do React (ex.: /amplie-films) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
