services:
  ampliemarketing:
    build: .
    image: amplie-landing-page:latest
    ports:
      - "3031:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.ampliemarketing.rule=Host(`ampliemarketing.com`) || Host(`www.ampliemarketing.com`)"
      - "traefik.http.routers.ampliemarketing.entrypoints=websecure"
      - "traefik.http.routers.ampliemarketing.tls=true"
      - "traefik.http.routers.ampliemarketing.tls.certresolver=myresolver"
      - "traefik.http.services.ampliemarketing.loadbalancer.server.port=80"
      # Redirecionamento HTTP para HTTPS automático
      - "traefik.http.routers.ampliemarketing-http.rule=Host(`ampliemarketing.com`) || Host(`www.ampliemarketing.com`)"
      - "traefik.http.routers.ampliemarketing-http.entrypoints=web"
      - "traefik.http.routers.ampliemarketing-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=web"
        - "traefik.http.routers.ampliemarketing.rule=Host(`ampliemarketing.com`) || Host(`www.ampliemarketing.com`)"
        - "traefik.http.routers.ampliemarketing.entrypoints=websecure"
        - "traefik.http.routers.ampliemarketing.tls=true"
        - "traefik.http.routers.ampliemarketing.tls.certresolver=myresolver"
        - "traefik.http.services.ampliemarketing.loadbalancer.server.port=80"
        # Redirecionamento HTTP para HTTPS automático
        - "traefik.http.routers.ampliemarketing-http.rule=Host(`ampliemarketing.com`) || Host(`www.ampliemarketing.com`)"
        - "traefik.http.routers.ampliemarketing-http.entrypoints=web"
        - "traefik.http.routers.ampliemarketing-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - web

networks:
  web:
    external: true
