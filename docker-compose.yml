# Sobe o site atrás do Traefik, com HTTPS automático (Let's Encrypt).
# Configure DOMINIO e EMAIL_LETSENCRYPT no arquivo .env (veja .env.example).
#
#   docker compose up -d --build

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
      # HTTP (80) redireciona tudo para HTTPS (443)
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Certificados gratuitos do Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL_LETSENCRYPT}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - web

  site:
    build: .
    image: amplie-landing-page
    container_name: amplie-site
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.amplie.rule=Host(`${DOMINIO}`) || Host(`www.${DOMINIO}`)
      - traefik.http.routers.amplie.entrypoints=websecure
      - traefik.http.routers.amplie.tls.certresolver=letsencrypt
      - traefik.http.services.amplie.loadbalancer.server.port=80
      # www.dominio -> dominio
      - traefik.http.routers.amplie.middlewares=amplie-sem-www
      - traefik.http.middlewares.amplie-sem-www.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.amplie-sem-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.amplie-sem-www.redirectregex.permanent=true
    networks:
      - web

networks:
  web:
    name: web

volumes:
  letsencrypt:
